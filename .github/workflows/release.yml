name: Release
"on":
  push:
    branches:
      - master
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  release:
    name: "Maintain releases (release-please)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Run release with Zuke
        run: ./zuke release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
  actionRelease:
    name: Release the composite action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - release
    if: "${{ !cancelled() }}"
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
          fetch-depth: "0"
      - name: Run actionRelease with Zuke
        run: ./zuke actionRelease
        env:
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
  publishJsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - release
    timeout-minutes: 30
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Run publishJsr with Zuke
        run: ./zuke publishJsr
  syncWebsite:
    name: "Sync website docs + API reference"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - publishJsr
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 registry.npmjs.org:443"
      - name: Run syncWebsite with Zuke
        run: ./zuke syncWebsite
        env:
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
  cliBinaries:
    name: "CLI binaries: plan and compile"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - publishJsr
    timeout-minutes: 30
    outputs:
      version: "${{ steps.plan.outputs.version }}"
      build: "${{ steps.plan.outputs.build }}"
      tap: "${{ steps.plan.outputs.tap }}"
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: "Plan the CLI release, and compile when owed"
        id: plan
        run: ./zuke cliBinaries
      - name: Hand the binaries to the signing job
        if: "steps.plan.outputs.build == 'true'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: dist/cli/bin
          if-no-files-found: error
          retention-days: "1"
  cliSign:
    name: "CLI binaries: sign and notarize (macOS)"
    runs-on: macos-latest
    environment: cli-signing
    permissions:
      contents: read
    needs:
      - cliBinaries
    if: "needs.cliBinaries.outputs.build == 'true'"
    timeout-minutes: 60
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Fetch the compiled binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist/cli/bin
      - name: Run cliSign with Zuke
        run: ./zuke cliSign
        env:
          APPLE_CERTIFICATE_P12: "${{ secrets.APPLE_CERTIFICATE_P12 }}"
          APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          APPLE_NOTARY_KEY: "${{ secrets.APPLE_NOTARY_KEY }}"
          APPLE_NOTARY_KEY_ID: "${{ secrets.APPLE_NOTARY_KEY_ID }}"
          APPLE_NOTARY_ISSUER: "${{ secrets.APPLE_NOTARY_ISSUER }}"
      - name: Hand the signed binaries on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries-signed
          path: "dist/cli/bin/*-apple-darwin"
          if-no-files-found: error
          retention-days: "1"
  cliUpload:
    name: "CLI binaries: package, attest and upload"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - cliBinaries
      - cliSign
    if: "needs.cliBinaries.outputs.build == 'true'"
    timeout-minutes: 20
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Fetch the compiled binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist/cli/bin
      - name: Fetch the signed macOS binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries-signed
          path: dist/cli/bin
      - name: Package the archives
        run: ./zuke cliPackage
      - name: "Attest the archives' build provenance"
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cli/release/*.tar.gz
            dist/cli/release/SHA256SUMS
      - name: Upload to the release
        run: ./zuke cliUpload
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CLI_ATTESTATION_BUNDLE: "${{ steps.attest.outputs.bundle-path }}"
  cliFormulaVerify:
    name: "Verify formula (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    needs:
      - cliBinaries
      - cliUpload
    if: "${{ !cancelled() && needs.cliBinaries.outputs.tap == 'true' && (needs.cliBinaries.outputs.build != 'true' || needs.cliUpload.result == 'success') }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Put Homebrew on PATH
        if: "runner.os == 'Linux'"
        run: "echo \"/home/linuxbrew/.linuxbrew/bin\" >> \"$GITHUB_PATH\""
      - name: Run cliFormulaVerify with Zuke
        run: ./zuke cliFormulaVerify
  cliTap:
    name: "CLI binaries: publish the Homebrew formula"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - cliBinaries
      - cliFormulaVerify
    if: "${{ !cancelled() && needs.cliFormulaVerify.result == 'success' }}"
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2478fa5a69fb4f16540e54959c98cd976ec3f075 # v1.0.5
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
      - name: Run cliTap with Zuke
        run: ./zuke cliTap
        env:
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
