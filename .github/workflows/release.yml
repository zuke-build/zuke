name: Release
"on":
  push:
    branches:
      - master
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  release:
    name: "Maintain releases (release-please)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Run release with Zuke
        run: ./zuke release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  publishJsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - release
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Run publishJsr with Zuke
        run: ./zuke publishJsr
  syncWebsite:
    name: "Sync website docs + API reference"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - publishJsr
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 registry.npmjs.org:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Run syncWebsite with Zuke
        run: ./zuke syncWebsite
        env:
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
