name: Release
"on":
  push:
    branches:
      - master
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  release:
    name: "Maintain releases (release-please)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@5400f044d0b56206b0fa48c90b30486df205c7c6 # v1.0.2
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Run release with Zuke
        run: ./zuke release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  actionRelease:
    name: Release the composite action
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs:
      - release
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@5400f044d0b56206b0fa48c90b30486df205c7c6 # v1.0.2
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 registry.npmjs.org:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
          fetch-depth: "0"
      - name: Run actionRelease with Zuke
        run: ./zuke actionRelease
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  publishJsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - release
    timeout-minutes: 30
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@5400f044d0b56206b0fa48c90b30486df205c7c6 # v1.0.2
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Run publishJsr with Zuke
        run: ./zuke publishJsr
  syncWebsite:
    name: "Sync website docs + API reference"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - publishJsr
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@5400f044d0b56206b0fa48c90b30486df205c7c6 # v1.0.2
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 registry.npmjs.org:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
      - name: Run syncWebsite with Zuke
        run: ./zuke syncWebsite
        env:
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
