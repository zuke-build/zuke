name: Security scanners
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "42 5 * * 3"
permissions:
  contents: read
jobs:
  security:
    name: "Scan with Zuke (zuke/security)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@7a62523bb4569e4d90e972dee74bf9cf09cd436f # v1.0.1
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Run security with Zuke
        run: ./zuke security
