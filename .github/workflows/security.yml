name: Security scanners
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "42 5 * * 3"
permissions:
  contents: read
jobs:
  security:
    name: "Scan with Zuke (zuke/security)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@b2d0b02b0613505f06e125a600ec6cea4ca8fc7b # v1.0.10
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
          actions-cache: "true"
      - name: Run security with Zuke
        run: ./zuke security
