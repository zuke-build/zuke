name: Security scanners
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "42 5 * * 3"
permissions:
  contents: read
jobs:
  security:
    name: "Scan with Zuke (zuke/security)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@213d5234c03e1fedc314159a77b2f680c2d6c8f5 # v1.0.7
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
          actions-cache: "true"
      - name: Run security with Zuke
        run: ./zuke security
