name: Security scanners
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "42 5 * * 3"
permissions:
  contents: read
jobs:
  security:
    name: "Scan with Zuke (zuke/security)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@517dc954200eae7c54125406675c329fa8cfb811 # v1.0.9
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
          actions-cache: "true"
      - name: Run security with Zuke
        run: ./zuke security
