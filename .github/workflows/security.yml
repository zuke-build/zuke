name: Security scanners
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "42 5 * * 3"
permissions:
  contents: read
jobs:
  security:
    name: "Scan with Zuke (zuke/security)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@ec0b756878572e04145cd766e2268e55b8577abf # v1.0.3
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Run security with Zuke
        run: ./zuke security
