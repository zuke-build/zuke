name: Security scanners
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "42 5 * * 3"
permissions:
  contents: read
jobs:
  security:
    name: "Scan with Zuke (zuke/security)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@0415030dadcb505946392ca0dc8191ee4390701b # v1.0.4
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Run security with Zuke
        run: ./zuke security
