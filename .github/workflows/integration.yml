name: Integration
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: "integration-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  e2e:
    name: "E2E (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@7a62523bb4569e4d90e972dee74bf9cf09cd436f # v1.0.1
        with:
          egress-policy: audit
          persist-credentials: "false"
          deno-version: v2.8.3
      - name: Run the subprocess e2e suite
        run: deno run -A --frozen zuke.ts integration
