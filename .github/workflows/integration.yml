name: Integration
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: "integration-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  e2e:
    name: "E2E (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@f141aa93020940f65349f87a96bab93b44cab160 # v1.0.12
        with:
          egress-policy: audit
          persist-credentials: "false"
          deno-version: v2.8.3
          node-version: 26.13.1
      - name: Run the subprocess e2e suite
        run: deno run -A --frozen build.ts integration
