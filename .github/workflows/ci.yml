name: CI
"on":
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci:
    name: "Build & verify with Zuke"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@f141aa93020940f65349f87a96bab93b44cab160 # v1.0.12
        with:
          egress-policy: block
          persist-credentials: "true"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 registry.npmjs.org:443 npm.jsr.io:443 api.openai.com:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 cli.codecov.io:443 api.codecov.io:443 ingest.codecov.io:443 storage.googleapis.com:443 tuf-repo-cdn.sigstore.dev:443 plugins.dprint.dev:443 nodejs.org:443"
          fetch-depth: "0"
          ref: "${{ (github.event.pull_request.head.repo.full_name == github.repository) && github.head_ref || '' }}"
          node-version: 26.13.1
          actions-cache: "true"
      - name: Install the npm workspace
        run: npm ci --ignore-scripts
      - name: Run ci on Node
        run: node build.ts ci
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
          PR_BODY: "${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}"
          ZUKE_PLUGIN_BASE_REF: "${{ github.event_name == 'push' && 'HEAD^' || '' }}"
  coreFloorCheck:
    name: Core version floors
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@f141aa93020940f65349f87a96bab93b44cab160 # v1.0.12
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
          actions-cache: "true"
      - name: Run coreFloorCheck with Zuke
        run: ./zuke coreFloorCheck
  gate:
    name: "Gate on Node (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@f141aa93020940f65349f87a96bab93b44cab160 # v1.0.12
        with:
          egress-policy: audit
          persist-credentials: "false"
          fetch-depth: "0"
          node-version: 26.13.1
      - name: Install the npm workspace
        run: npm ci --ignore-scripts
      - name: Run ci on Node
        run: node build.ts ci
        env:
          PR_BODY: "${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}"
  test:
    name: "Tests (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Run tests and the coverage gate with the bash launcher
        if: "runner.os == 'Linux'"
        run: ./zuke coverage
        env:
          DENO_VERSION: v2.9.8
      - name: Run tests with the bash launcher
        if: "runner.os == 'macOS'"
        run: ./zuke test
        env:
          DENO_VERSION: v2.9.8
      - name: Run tests with the PowerShell launcher
        if: "runner.os == 'Windows'"
        shell: pwsh
        run: ./zuke.ps1 test
