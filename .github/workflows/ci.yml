name: CI
"on":
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci:
    name: "Build & verify with Zuke"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 registry.npmjs.org:443 api.openai.com:443 api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 cli.codecov.io:443 api.codecov.io:443 ingest.codecov.io:443 storage.googleapis.com:443"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "true"
          ref: "${{ (github.event.pull_request.head.repo.full_name == github.repository) && github.head_ref || '' }}"
      - name: Run ci with Zuke
        run: ./zuke ci
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
          PR_BODY: "${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}"
  coreFloorCheck:
    name: Core version floors
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Run coreFloorCheck with Zuke
        run: ./zuke coreFloorCheck
  test:
    name: "Tests (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Run tests with the bash launcher
        if: "runner.os != 'Windows'"
        run: ./zuke test
        env:
          DENO_VERSION: v2.8.3
      - name: Run tests with the PowerShell launcher
        if: "runner.os == 'Windows'"
        shell: pwsh
        run: ./zuke.ps1 test
