name: CodeQL
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "31 4 * * 4"
permissions:
  contents: read
concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@517dc954200eae7c54125406675c329fa8cfb811 # v1.0.9
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: "javascript-typescript,actions"
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
