name: CodeQL
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "31 4 * * 4"
permissions:
  contents: read
concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@2eac30bdd8cdbcc60c208d879f1088a592ea84b4 # v1.0.6
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: "javascript-typescript,actions"
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
