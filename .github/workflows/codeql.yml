name: CodeQL
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "31 4 * * 4"
permissions:
  contents: read
concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@6d44df88d10e9d6027aa5d34054c8aa40a001c05 # v1.0.11
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: "javascript-typescript,actions"
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
