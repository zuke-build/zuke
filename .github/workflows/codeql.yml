name: CodeQL
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "31 4 * * 4"
permissions:
  contents: read
concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@213d5234c03e1fedc314159a77b2f680c2d6c8f5 # v1.0.7
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: "javascript-typescript,actions"
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
