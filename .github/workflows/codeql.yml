name: CodeQL
"on":
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "31 4 * * 4"
permissions:
  contents: read
concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@b0832247daa16321be405a10b71c022317d2c5a4 # v1.0.8
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: "javascript-typescript,actions"
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
