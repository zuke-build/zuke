name: AI Review
"on":
  pull_request: {}
  issue_comment:
    types:
      - created
permissions:
  contents: read
jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}"
    timeout-minutes: 15
    concurrency:
      group: "ai-review-${{ github.workflow }}-${{ github.event.pull_request.number }}"
      cancel-in-progress: true
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@f141aa93020940f65349f87a96bab93b44cab160 # v1.0.12
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 api.openai.com:443"
      - name: AI review with Zuke
        run: ./zuke review
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
  commandReview:
    name: AI review on command
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    if: "${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && (startsWith(github.event.comment.body, '@zuke-build review') || startsWith(github.event.comment.body, '@zuke-build accept')) }}"
    timeout-minutes: 15
    concurrency:
      group: "ai-review-${{ github.workflow }}-${{ github.event.issue.number }}"
      cancel-in-progress: false
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@f141aa93020940f65349f87a96bab93b44cab160 # v1.0.12
        with:
          egress-policy: block
          persist-credentials: "false"
          allowed-endpoints: "deno.land:443 dl.deno.land:443 jsr.io:443 github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 api.openai.com:443"
      - name: Check the commenter may start a review
        id: callers
        run: ./zuke review --preflight
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ZUKE_REVIEW_PR: "${{ github.event.issue.number }}"
          ZUKE_REVIEW_COMMENT: "${{ github.event.comment.id }}"
          ZUKE_REVIEW_ACTOR: "${{ github.event.comment.user.login }}"
          ZUKE_REVIEW_ROLE: write
        continue-on-error: true
      - name: "Re-run the pull request's own review"
        id: rerun
        if: "steps.callers.outcome == 'success'"
        run: |
          read -r head_repo head_sha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$ZUKE_REVIEW_PR" --jq '(.head.repo.full_name // "-") + " " + .head.sha')
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || exit 0
          wf="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; wf="${wf%@*}"; wf="${wf##*/}"
          export head_sha
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=pull_request&status=completed&head_sha=$head_sha&per_page=100" --jq '[.workflow_runs[] | select(.head_sha == env.head_sha and .head_repository.full_name == env.GITHUB_REPOSITORY and any(.pull_requests[]?; .number == (env.ZUKE_REVIEW_PR | tonumber)))] | first | .id // empty')
          [ -n "$run_id" ] || exit 0
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun" --silent
          echo "rerun=true" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$ZUKE_REVIEW_COMMENT/reactions" -f content=+1 --silent || true
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ZUKE_REVIEW_PR: "${{ github.event.issue.number }}"
          ZUKE_REVIEW_COMMENT: "${{ github.event.comment.id }}"
        continue-on-error: true
      - name: AI review with Zuke
        if: "steps.callers.outcome == 'success' && steps.rerun.outputs.rerun != 'true'"
        run: ./zuke review
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
          ZUKE_REVIEW_PR: "${{ github.event.issue.number }}"
          ZUKE_REVIEW_COMMENT: "${{ github.event.comment.id }}"
          ZUKE_REVIEW_ACTOR: "${{ github.event.comment.user.login }}"
          ZUKE_REVIEW_ROLE: write
